[project]
name = "wireio"
version = "0.1.0"
description = "Modern Python serial port library — pyserial replacement"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Agentine" }
]
requires-python = ">=3.10"
dependencies = []
keywords = ["serial", "uart", "com", "tty", "rs232", "hardware", "embedded", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Communications",
    "Typing :: Typed",
]

[project.scripts]
wireio-list-ports = "wireio.tools.list_ports:main"
wireio-miniterm = "wireio.tools.miniterm:main"

[project.urls]
Homepage = "https://github.com/agentine/wireio"
Repository = "https://github.com/agentine/wireio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wireio"]

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
